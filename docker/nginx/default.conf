map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location = /api/auth/initialize {
        return 403;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_api http://api:5050;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE / Streaming support
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeout for long-running LLM requests
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    location /avatars/ {
        alias /app/data/avatars/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /public/ {
        return 404;
    }

    location /knowledgebases/ {
        return 404;
    }

    location /public/ {
        limit_except GET {
            deny all;
        }
        resolver 127.0.0.11 valid=10s;
        set $upstream_public http://minio:9000;
        proxy_pass $upstream_public;
        proxy_set_header Host minio:9000;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
}
