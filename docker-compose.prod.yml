name: yunesa-app

x-api-worker-env: &api-worker-env
  RUNNING_IN_DOCKER: "true"
  YUNESA_ENV: production
  LITE_MODE: "false"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
  GLOBAL_PASSWORD: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
  POSTGRES_URL: postgresql+asyncpg://postgres:${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}@postgres:5432/postgres
  REDIS_URL: redis://redis:6379/0
  YUNESA_VECTOR_BACKEND: qdrant
  QDRANT_URI: http://vector:6333
  QDRANT_API_KEY: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
  # Empty Milvus/Zilliz values prevent inherited development settings selecting another adapter.
  MILVUS_URI: ""
  MILVUS_TOKEN: ""
  ZILLIZ_URI: ""
  ZILLIZ_TOKEN: ""
  NEO4J_URI: bolt://graph:7687
  NEO4J_USERNAME: ""
  NEO4J_PASSWORD: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
  NEO4J_DATABASE: memgraph
  MINIO_URI: http://minio:9000
  MINIO_ROOT_USER: yunesa
  MINIO_ROOT_PASSWORD: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://minio:9000}
  GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY required}
  SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?SILICONFLOW_API_KEY required}
  MODEL_DIR: /models
  MODEL_DIR_IN_DOCKER: /models
  AVATAR_STORAGE_PATH: /app/data/avatars
  AVATAR_URL_PREFIX: /avatars
  SANDBOX_ENABLED: "false"
  BACKEND_RELOAD: "false"
  LANGGRAPH_CHECKPOINTER_BACKEND: postgres
  OPIK_ENABLED: "false"
  NO_PROXY: localhost,127.0.0.1,vector,graph,postgres,redis,minio
  no_proxy: localhost,127.0.0.1,vector,graph,postgres,redis,minio

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-volumes: &app-volumes
  - ${YUNESA_STATE_ROOT:?YUNESA_STATE_ROOT required}/saves:/app/saves
  - ${YUNESA_STATE_ROOT:?YUNESA_STATE_ROOT required}/data:/app/data
  - ${YUNESA_STATE_ROOT:?YUNESA_STATE_ROOT required}/models:/models

services:
  api:
    image: ${YUNESA_API_IMAGE:?YUNESA_API_IMAGE required}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    memswap_limit: 1g
    volumes: *app-volumes
    networks: [app-network]
    env_file: [.env]
    environment: *api-worker-env
    command: uvicorn server.main:app --host 0.0.0.0 --port 5050 --proxy-headers --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5050/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      graph: {condition: service_healthy}
      vector: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    image: ${YUNESA_API_IMAGE:?YUNESA_API_IMAGE required}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 1g
    volumes: *app-volumes
    networks: [app-network]
    env_file: [.env]
    environment: *api-worker-env
    command: arq server.worker_main.WorkerSettings
    healthcheck:
      test: ["CMD", "arq", "--check", "server.worker_main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      api: {condition: service_healthy}

  web:
    image: ${YUNESA_WEB_IMAGE:?YUNESA_WEB_IMAGE required}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ${YUNESA_STATE_ROOT:?YUNESA_STATE_ROOT required}/data/avatars:/app/data/avatars:ro
    networks: [app-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api: {condition: service_healthy}

  graph:
    image: memgraph/memgraph:3.6.0@sha256:fa51fa1f64bce77fc20fc351632f684fd22afc7916febaba30fc2af24815f5a4
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    memswap_limit: 1g
    command:
      - --telemetry-enabled=false
      - --memory-limit=256
      - --log-level=WARNING
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687 --use-ssl=false || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app-network]

  vector:
    image: qdrant/qdrant:v1.16.0@sha256:1005201498cf927d835383d0f918b17d8c9da7db58550f169f694455e42d78f4
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 192m
    memswap_limit: 512m
    environment:
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__SERVICE__API_KEY: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
      QDRANT__LOG_LEVEL: WARN
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [app-network]

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 160m
    memswap_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
      POSTGRES_DB: postgres
    command: postgres -c shared_buffers=64MB -c max_connections=40 -c work_mem=2MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [app-network]

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    # Run queue and cancellation state must fail visibly rather than being evicted.
    command: redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    networks: [app-network]

  minio:
    image: ${YUNESA_MINIO_IMAGE:?YUNESA_MINIO_IMAGE required}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    memswap_limit: 512m
    environment:
      MINIO_ROOT_USER: yunesa
      MINIO_ROOT_PASSWORD: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
      GOGC: '30'
      GOMEMLIMIT: 96MiB
    command: server /data
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [app-network]

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  memgraph-data:
  qdrant-data:
  redis-data:
  minio-data:
